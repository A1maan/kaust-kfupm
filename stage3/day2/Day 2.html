<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Computer Vision Practice Quiz</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.4; }
  .topbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  button { padding: 8px 12px; cursor: pointer; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin: 12px 0; }
  .qtitle { font-weight: 700; margin-bottom: 10px; }
  .opts { display:grid; gap:8px; }
  label { display:flex; gap:10px; align-items:flex-start; border:1px solid #eee; border-radius:8px; padding:10px; }
  label:hover { background:#fafafa; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid #ddd; }
  .correct { border-color: #2e7d32 !important; background: #f1fff3 !important; }
  .wrong { border-color: #c62828 !important; background: #fff2f2 !important; }
  .explain { margin-top:10px; font-size: 13px; color:#333; }
  .muted { color:#666; font-size: 13px; }
  .score { font-weight:700; }
  .footer { margin-top: 18px; color:#666; font-size: 12px; }
</style>
</head>
<body>
<h1>Computer Vision Practice Quiz</h1>
<div class="topbar">
  <button id="shuffleBtn">Shuffle Questions</button>
  <button id="resetBtn">Reset Answers</button>
  <button id="checkBtn">Check Answers</button>
  <span class="score" id="scoreText"></span>
  <span class="muted" id="progressText"></span>
</div>
<div class="muted">Select one option per question. Click <b>Check Answers</b> to see feedback and short reasoning.</div>
<div id="quiz"></div>
<div class="footer">Tip: Shuffle repeatedly to practice recall, not position.</div>

<script>
const original = [{"q": "In a custom PyTorch dataset, which pair of methods must be implemented to make it indexable and compatible with a DataLoader?", "options": ["__len__ and __getitem__", "forward and backward", "fit and predict", "state_dict and load_state_dict"], "answer": 0, "why": "Dataset subclasses define size via __len__ and sample retrieval via __getitem__."}, {"q": "What is the primary role of a DataLoader compared with a Dataset object?", "options": ["Define model layers and losses", "Create mini-batches with shuffling and parallel loading", "Store weights and optimizer state", "Compute gradients and update parameters"], "answer": 1, "why": "DataLoader handles batching, shuffling, and multiprocessing over a Dataset."}, {"q": "Why are DataLoaders especially important when training with stochastic gradient descent?", "options": ["They ensure the same sample order every epoch", "They feed the optimizer small randomized batches efficiently", "They eliminate the need for a validation set", "They automatically tune the learning rate"], "answer": 1, "why": "SGD relies on mini-batches; loaders provide batches and randomization efficiently."}, {"q": "Which statement best describes the relationship between on-disk data and a PyTorch Dataset?", "options": ["A Dataset caches all data in GPU memory by default", "A Dataset provides an indexed view that loads samples on demand", "A Dataset only works with tabular CSV files", "A Dataset replaces the need for transforms/augmentations"], "answer": 1, "why": "The Dataset acts like an indexable wrapper around stored data, often loading per item."}, {"q": "Which built-in behavior is commonly configured in a DataLoader to improve training robustness?", "options": ["Gradient clipping", "Shuffling the dataset each epoch", "Weight decay", "Label smoothing"], "answer": 1, "why": "Shuffling reduces ordering bias and improves SGD training behavior."}, {"q": "A key motivation for image data augmentation is to:", "options": ["Guarantee zero training error", "Increase effective data diversity when datasets are limited", "Remove the need for regularization", "Make validation accuracy always higher than training"], "answer": 1, "why": "Augmentation expands variety of training examples, helping generalization with limited data."}, {"q": "Which transformation is an example of geometric augmentation?", "options": ["Random rotation", "Color casting", "Brightness jitter", "Gaussian noise"], "answer": 0, "why": "Rotation changes geometry; the others are photometric/noise changes."}, {"q": "Which transformation is an example of photometric augmentation?", "options": ["Horizontal flip", "Random crop", "Color casting", "Translation"], "answer": 2, "why": "Color casting changes image appearance (color/illumination) rather than geometry."}, {"q": "When choosing augmentations, the most effective strategy presented is to:", "options": ["Apply every available augmentation uniformly", "Select augmentations based on systematic error analysis", "Only use augmentations after reaching perfect validation accuracy", "Avoid augmentations if using a pretrained model"], "answer": 1, "why": "Error analysis reveals failure modes; augmentations should target those weaknesses."}, {"q": "A model frequently misclassifies small objects because they appear tiny in the image. Which targeted augmentation is most aligned with that failure mode?", "options": ["Random scaling/zooming to vary object size", "Only adding Gaussian noise", "Converting all images to grayscale", "Always rotating by 180 degrees"], "answer": 0, "why": "Scaling/zooming helps the model handle size variation and small-object cases."}, {"q": "A dataset includes images under varied lighting conditions, and the model fails on dim scenes. Which augmentation directly addresses this?", "options": ["Random brightness/contrast or color jitter", "Random cropping only", "Elastic geometric distortion only", "Always flipping vertically"], "answer": 0, "why": "Brightness/contrast/color jitter simulates lighting changes."}, {"q": "Why should augmentations generally be applied only to the training split?", "options": ["Because validation data must remain a stable measure of real performance", "Because DataLoader cannot apply transforms to validation sets", "Because augmentations break backpropagation", "Because augmentations reduce training speed too much"], "answer": 0, "why": "Validation/test should reflect the true data distribution for fair evaluation."}, {"q": "Test-time augmentation (TTA) is best described as:", "options": ["Applying random augmentations to labels", "A training technique that replaces backpropagation", "Running inference on multiple augmented versions and averaging predictions", "A method to oversample minority classes"], "answer": 2, "why": "TTA aggregates predictions from several augmented views at inference."}, {"q": "In TTA for classification, combining results is typically done by:", "options": ["Averaging predicted class probabilities across augmented inputs", "Taking the minimum logit across augmented inputs", "Replacing softmax with sigmoid always", "Using dropout only at inference"], "answer": 0, "why": "The standard approach is to average probabilities (or logits) across augmentations."}, {"q": "Which is a practical drawback of using TTA?", "options": ["It requires multiple forward passes per example", "It prevents use of pretrained models", "It makes the model architecture invalid", "It forces you to remove batch normalization"], "answer": 0, "why": "Multiple augmented inferences increase computation and often require custom aggregation."}, {"q": "Fine-tuning in transfer learning means:", "options": ["Training a model from scratch with random initialization", "Adjusting a pretrained model\u2019s weights for a new task", "Freezing all layers permanently and never training", "Only changing the optimizer without changing weights"], "answer": 1, "why": "Fine-tuning adapts pretrained weights to a target dataset/task."}, {"q": "Why does starting from a pretrained model often save time and compute?", "options": ["Pretrained features reduce the amount of training needed to reach good performance", "Pretrained models do not require data loaders", "Pretrained models avoid the need for validation", "Pretrained models automatically perform ensembling"], "answer": 0, "why": "Pretrained networks already encode useful features, reducing required training effort."}, {"q": "You have a small dataset that is similar to the dataset used for pretraining. A recommended approach is to:", "options": ["Freeze most of the feature extractor and train a new classifier head", "Train the entire network from scratch", "Use boosting with decision trees only", "Disable all regularization techniques"], "answer": 0, "why": "With small similar data, reuse learned features and train the final layers/classifier."}, {"q": "You have a large labeled dataset for your target task. The guidance suggests you can often:", "options": ["Fine-tune the entire network", "Only train the first convolutional layer", "Avoid training any layers and just run inference", "Replace the network with k-means clustering"], "answer": 0, "why": "With enough data, full fine-tuning can adapt all layers effectively."}, {"q": "In a typical transfer learning setup for classification, what is commonly replaced?", "options": ["The final classification layer(s) to match the new number of classes", "All convolution layers are removed", "The input images are converted to text", "The optimizer is replaced by a rule-based system"], "answer": 0, "why": "The pretrained backbone is reused and the task-specific head is replaced."}, {"q": "The main reason ensembles can improve performance is that:", "options": ["All models make identical errors", "Different models tend to make different errors, so combining reduces overall error", "Ensembling increases the training set size", "Ensembling removes the need for preprocessing"], "answer": 1, "why": "Diversity in errors lets averaging/voting cancel some mistakes."}, {"q": "Bagging creates diversity primarily by:", "options": ["Training models sequentially so each fixes the previous model\u2019s mistakes", "Training models on different bootstrap samples/subsets of data", "Training a single model with dropout", "Changing the loss function every batch"], "answer": 1, "why": "Bagging trains multiple models on different data subsets to diversify predictions."}, {"q": "Boosting differs from bagging because boosting typically:", "options": ["Trains models in parallel on random subsets", "Trains models sequentially, emphasizing previously misclassified examples", "Uses only neural networks, never trees", "Requires no labels"], "answer": 1, "why": "Boosting focuses successive learners on the errors of earlier learners."}, {"q": "Hard voting in a classifier ensemble means:", "options": ["Averaging predicted probabilities and then choosing the max", "Selecting the class predicted by the majority of models", "Multiplying logits across models", "Always choosing the class from the best single model"], "answer": 1, "why": "Hard voting uses majority class counts from individual model predictions."}, {"q": "Soft voting in a classifier ensemble means:", "options": ["Averaging class probabilities (or logits) across models before deciding", "Taking a random model\u2019s prediction each time", "Voting only among models with dropout", "Using median pixel intensity as the output"], "answer": 0, "why": "Soft voting aggregates confidence scores, then selects the highest."}, {"q": "For an ensemble of regressors, a common aggregation rule is to:", "options": ["Take the maximum prediction", "Average the predictions", "Convert outputs to class labels", "Use hard voting"], "answer": 1, "why": "Regression ensembles typically average numeric outputs."}, {"q": "A key requirement for ensembles to help is that models should be:", "options": ["Identical architectures with identical training runs", "Diverse in their errors or perspectives", "Always trained with the same random seed", "All trained without any regularization"], "answer": 1, "why": "Diversity reduces correlated errors, making combination beneficial."}, {"q": "Dropout is best characterized as:", "options": ["A method that increases the learning rate automatically", "A regularization technique that randomly deactivates neurons during training", "A data augmentation method applied to validation data", "A loss function for multi-class classification"], "answer": 1, "why": "Dropout randomly drops units during training to reduce co-adaptation/overfitting."}, {"q": "During training with dropout, each forward pass effectively samples:", "options": ["A different subnetwork from the full network", "A different dataset split", "A different optimizer", "A different label set"], "answer": 0, "why": "Dropping units yields a different active network each iteration."}, {"q": "Why can dropout be viewed as similar to ensembling?", "options": ["Because it trains one model and never changes it", "Because it implicitly averages many subnetworks across training and inference", "Because it duplicates the dataset into multiple copies", "Because it converts classification to regression"], "answer": 1, "why": "Many subnetworks are trained; inference approximates averaging their effects."}, {"q": "What typically happens to dropout at inference time?", "options": ["It remains active to keep randomness high", "It is disabled, using all neurons", "It doubles the batch size automatically", "It replaces batch normalization"], "answer": 1, "why": "Inference uses the full network; dropout is turned off."}, {"q": "If dropout keep probability is p during training, a common way to keep activation scale consistent is to:", "options": ["Scale activations by p at inference (or equivalently use inverted dropout during training)", "Scale activations by (1/p) at inference always", "Never scale activations at all", "Scale labels instead of activations"], "answer": 0, "why": "Scaling aligns expected activations between train and test behavior."}, {"q": "In PyTorch, which calls correctly switch behavior for dropout layers?", "options": ["model.zero_grad() and optimizer.step()", "model.train() for training, model.eval() for inference", "torch.no_grad() for training, torch.enable_grad() for inference", "model.cuda() for training, model.cpu() for inference"], "answer": 1, "why": "train() enables training-time behavior; eval() disables dropout randomness."}, {"q": "Batch normalization (BN) normalizes activations using:", "options": ["Dataset-wide mean/variance computed once before training", "Batch mean and batch variance (with running estimates for inference)", "Only the maximum value in a batch", "Only the gradient magnitudes"], "answer": 1, "why": "BN uses mini-batch statistics during training and running averages at inference."}, {"q": "BN includes learnable parameters that allow the network to adjust the normalized output. These are:", "options": ["Momentum and weight decay", "Gamma (scale) and beta (shift)", "Drop rate and keep rate", "Precision and recall"], "answer": 1, "why": "BN applies learnable scale (\u03b3) and shift (\u03b2) after normalization."}, {"q": "Why are gamma and beta important in BN?", "options": ["They force outputs to be exactly zero mean and unit variance always", "They allow the layer to keep or undo normalization if beneficial", "They compute gradients without backpropagation", "They replace the need for a loss function"], "answer": 1, "why": "Learned \u03b3/\u03b2 let the model choose the best normalized or re-centered distribution."}, {"q": "During inference, BN typically uses:", "options": ["Current batch mean/variance from the test batch only", "Running (moving) averages of mean and variance accumulated during training", "Random noise injection", "Dropout masks"], "answer": 1, "why": "Inference relies on stored running statistics for stable behavior."}, {"q": "A common placement for BN in a neural network block is:", "options": ["After the activation function only", "Before the linear/conv layer only", "After linear/conv and before the nonlinearity", "Only at the very end of the network"], "answer": 2, "why": "A standard pattern is conv/FC \u2192 BN \u2192 activation."}, {"q": "One advantage of BN highlighted is that it can:", "options": ["Make training more stable and allow higher learning rates", "Eliminate the need for data altogether", "Guarantee perfect generalization", "Prevent any overfitting without other methods"], "answer": 0, "why": "BN stabilizes internal distributions, often enabling faster, more stable training."}, {"q": "A common pitfall with BN is that:", "options": ["It behaves identically in train and eval modes", "Train and inference behavior differ, so forgetting model.eval() can break results", "It cannot be used with convolution layers", "It requires grayscale images only"], "answer": 1, "why": "BN uses batch stats in training but running stats in eval; mode matters."}, {"q": "In PyTorch, what is the correct way to ensure BN uses running statistics at inference?", "options": ["Call model.eval() before inference", "Call optimizer.step() twice", "Call model.train() with torch.no_grad()", "Set batch_size=1 always"], "answer": 0, "why": "eval() switches BN to inference behavior using running averages."}, {"q": "Which statement about BN and deployment is consistent with the material?", "options": ["BN can be fused into adjacent layers at test time in some setups", "BN must be removed before saving a model", "BN requires TTA to work", "BN prevents ensembling"], "answer": 0, "why": "BN can often be fused for inference efficiency once running stats are fixed."}, {"q": "A practical deep learning workflow begins by:", "options": ["Choosing dozens of augmentations immediately", "Building a baseline model and measuring validation performance", "Ensembling before any single model is trained", "Skipping validation and training on all data"], "answer": 1, "why": "Start with a baseline to establish a reference score and identify next steps."}, {"q": "After establishing a baseline, the next improvement loop is driven by:", "options": ["Randomly changing architecture each day", "Error analysis and targeted changes (augmentation/regularization/hyperparameters)", "Only increasing image resolution indefinitely", "Removing the validation set to avoid bias"], "answer": 1, "why": "Iterate based on observed errors and targeted interventions."}, {"q": "Which set of techniques are explicitly treated as regularization or stabilization tools in the content?", "options": ["Dropout and batch normalization", "Hard voting and TTA", "Bagging and boosting", "Random crop and color jitter"], "answer": 0, "why": "Dropout regularizes; BN stabilizes and can regularize."}, {"q": "Which approach is most aligned with the idea \u201cdon\u2019t start from scratch\u201d in practical deep learning?", "options": ["Always design a new architecture for every dataset", "Use pretrained models and adapt them via fine-tuning", "Never reuse code across projects", "Avoid transfer learning to keep things pure"], "answer": 1, "why": "Using pretrained models leverages prior learned representations and speeds progress."}, {"q": "You observe your model fails mainly on rotated instances of objects. Which targeted augmentation best fits?", "options": ["Random rotation", "Only adding blur", "Only converting to grayscale", "Always center-cropping to a fixed box"], "answer": 0, "why": "Rotation augmentation directly addresses orientation variation."}, {"q": "You observe failures on motion-blurred images. Which augmentation is most directly relevant?", "options": ["Add blur/noise augmentation", "Always mirror horizontally", "Only change hue", "Only resize to smaller images"], "answer": 0, "why": "Blur augmentation simulates motion blur conditions."}, {"q": "Which statement best captures the distinction between bagging and boosting?", "options": ["Bagging is sequential; boosting is parallel", "Bagging uses subsets/bootstraps independently; boosting trains learners sequentially to address errors", "Bagging requires no labels; boosting requires labels", "Bagging only applies to regression; boosting only to classification"], "answer": 1, "why": "Bagging trains in parallel on subsets; boosting is sequential focusing on mistakes."}, {"q": "If three classifiers each have a small independent error rate, majority voting can:", "options": ["Increase error compared with a single model always", "Reduce overall error compared with one classifier", "Guarantee zero error", "Make training unnecessary"], "answer": 1, "why": "With independent errors, majority vote reduces the chance all models are wrong."}, {"q": "Which of the following is a correct description of soft voting\u2019s input to the combiner?", "options": ["Discrete class labels only", "Per-class confidence scores (probabilities/logits)", "Only the dataset indices", "Only gradient norms"], "answer": 1, "why": "Soft voting aggregates probabilistic outputs rather than hard labels."}, {"q": "A student claims \u201caugmentations are just for making images look cool.\u201d The better technical interpretation is:", "options": ["Augmentations increase the effective training distribution diversity to improve generalization", "Augmentations are only for visualization and should not affect training", "Augmentations replace the need for labels", "Augmentations guarantee the model learns invariances without data"], "answer": 0, "why": "Augmentations simulate plausible variations so the model generalizes better."}, {"q": "Which practice best prevents you from choosing augmentations that don\u2019t actually help?", "options": ["Pick augmentations randomly each epoch", "Use error analysis on validation failures to guide augmentation selection", "Apply TTA during training only", "Only augment validation data to stress-test"], "answer": 1, "why": "Error analysis links augmentations to real observed failure modes."}, {"q": "Which is the most accurate characterization of TTA\u2019s goal?", "options": ["Reduce label noise by relabeling data", "Reduce prediction variance by aggregating multiple views at inference", "Speed up training by using fewer batches", "Replace ensembling entirely"], "answer": 1, "why": "TTA averages predictions from transformed inputs to improve robustness."}, {"q": "A model is overfitting (training accuracy high, validation low). Which technique directly targets this issue as presented?", "options": ["Dropout", "Turning off shuffling", "Removing the validation set", "Lowering input resolution permanently"], "answer": 0, "why": "Dropout is introduced as a regularization technique to combat overfitting."}, {"q": "If you forget to call model.eval() during inference, which two components are most likely to behave incorrectly?", "options": ["Dropout and batch normalization", "Loss function and labels", "Optimizer and scheduler", "Dataset and file paths"], "answer": 0, "why": "Dropout stays active and BN uses batch stats unless eval() is set."}, {"q": "Which is a correct statement about batch normalization statistics during training?", "options": ["They are computed from the entire dataset each step", "They use the mini-batch mean and variance for normalization", "They are fixed constants with no updates", "They are derived from the optimizer\u2019s momentum"], "answer": 1, "why": "Training BN normalizes using current batch statistics."}, {"q": "In BN, after normalization to x-hat, the output y is computed by:", "options": ["y = x-hat / (gamma + beta)", "y = gamma * x-hat + beta", "y = beta * x-hat - gamma", "y = x-hat + gamma + beta always"], "answer": 1, "why": "BN applies learnable scale \u03b3 and shift \u03b2: y = \u03b3x\u0302 + \u03b2."}, {"q": "Which workflow step most naturally comes immediately before deploying a model for real-world inference?", "options": ["Skip saving the model to avoid file issues", "Save the optimized model after iterative improvements", "Apply augmentations to the test set labels", "Train from scratch one final time without validation"], "answer": 1, "why": "After tuning, you save the final model and then deploy for inference."}, {"q": "Which combination is most consistent with building a strong baseline before heavy optimization?", "options": ["Start with pretrained weights, define metrics, train a simple initial model", "Begin with ensembling and TTA immediately", "Disable validation and tune only on training accuracy", "Apply every augmentation and regularizer from the first epoch"], "answer": 0, "why": "The workflow emphasizes a clean baseline with metrics/validation before iteration."}];
let questions = JSON.parse(JSON.stringify(original));

function escapeHtml(s) {
  return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function render() {
  const root = document.getElementById('quiz');
  root.innerHTML = '';
  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    const q = document.createElement('div');
    q.className = 'qtitle';
    q.innerHTML = `<span class="pill">Q${idx+1}</span> ${escapeHtml(item.q)}`;
    card.appendChild(q);

    const opts = document.createElement('div');
    opts.className = 'opts';

    // build option order mapping to ensure correct answer tracked after shuffling options
    const optionIndices = item.options.map((_, i) => i);
    // shuffle per render but stable within same render
    const shuffled = shuffleArray(optionIndices.slice());
    item._shuffled = shuffled;

    shuffled.forEach((optIndex, k) => {
      const optId = `q${idx}_o${k}`;
      const label = document.createElement('label');
      label.setAttribute('for', optId);

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = `q${idx}`;
      radio.id = optId;
      radio.value = String(optIndex);

      // restore selection if exists
      if (item._selected !== undefined && item._selected === optIndex) {
        radio.checked = true;
      }

      radio.addEventListener('change', () => {
        item._selected = optIndex;
        updateProgress();
      });

      const text = document.createElement('div');
      text.textContent = item.options[optIndex];

      label.appendChild(radio);
      label.appendChild(text);
      opts.appendChild(label);
    });

    card.appendChild(opts);

    const exp = document.createElement('div');
    exp.className = 'explain';
    exp.style.display = 'none';
    exp.textContent = item.why;
    card.appendChild(exp);

    root.appendChild(card);
  });
  updateProgress();
  document.getElementById('scoreText').textContent = '';
}

function updateProgress() {
  const answered = questions.filter(q => q._selected !== undefined).length;
  document.getElementById('progressText').textContent = `Answered: ${answered} / ${questions.length}`;
}

function resetAll() {
  questions.forEach(q => {
    delete q._selected;
  });
  render();
}

function shuffleQuestions() {
  questions = shuffleArray(questions.slice());
  render();
}

function checkAnswers() {
  let correct = 0;
  const cards = document.querySelectorAll('.card');
  questions.forEach((item, idx) => {
    const card = cards[idx];
    const labels = card.querySelectorAll('label');
    labels.forEach(l => l.classList.remove('correct','wrong'));

    const selected = item._selected;
    const answer = item.answer;

    if (selected !== undefined && selected === answer) correct++;

    // mark each option
    labels.forEach(l => {
      const radio = l.querySelector('input[type="radio"]');
      const val = Number(radio.value);
      if (val === answer) l.classList.add('correct');
      if (selected !== undefined && val === selected && selected !== answer) l.classList.add('wrong');
    });

    // show explanation
    const exp = card.querySelector('.explain');
    exp.style.display = 'block';
  });
  document.getElementById('scoreText').textContent = `Score: ${correct} / ${questions.length}`;
}

document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('shuffleBtn').addEventListener('click', shuffleQuestions);
document.getElementById('checkBtn').addEventListener('click', checkAnswers);

render();
</script>
</body>
</html>
